<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IRITOT: Personal Finance Tracker, 100% Offline Local">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRITOT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IRITOT: Personal Finance</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background-color: #0B0F17 !important;
      color: #FFFFFF;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    flutter-view, flt-glass-pane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      background-color: #0B0F17 !important;
    }
  </style>
</head>
<body>
  <script>
    // Lock document scroll to prevent iOS Safari touch coordinate drift
    window.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    }, { passive: false });
  </script>
  <script>
    window.iritotSpeech = {
      recognition: null,
      isListening: false,
      silenceTimer: null,
      silenceMs: 5000,
      userStopped: false,
      baseText: '',
      lastText: '',
      clearTimer: function() {
        if (this.silenceTimer) { clearTimeout(this.silenceTimer); this.silenceTimer = null; }
      },
      armTimer: function() {
        var self = this;
        this.clearTimer();
        // Auto finish after 5 seconds without new words
        this.silenceTimer = setTimeout(function() { self.stop(); }, this.silenceMs);
      },
      start: function(onResultCallback, onEndCallback, onErrorCallback) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (onErrorCallback) onErrorCallback("Browser ini belum mendukung Web Speech Recognition.");
          return false;
        }
        var self = this;
        try {
          if (this.recognition) {
            this.userStopped = true;
            this.recognition.abort();
          }
          this.userStopped = false;
          this.baseText = '';
          this.lastText = '';

          var begin = function() {
            var rec = new SpeechRecognition();
            rec.lang = 'id-ID';
            rec.continuous = true;
            rec.interimResults = true;
            rec.onresult = function(event) {
              var text = '';
              for (var i = 0; i < event.results.length; i++) {
                text += event.results[i][0].transcript;
              }
              var full = (self.baseText ? self.baseText + ' ' : '') + text;
              self.lastText = full;
              self.armTimer();
              if (onResultCallback) onResultCallback(full);
            };
            rec.onend = function() {
              if (!self.userStopped) {
                // Engine stopped by itself (common on mobile): resume until the silence timer ends the session
                self.baseText = self.lastText;
                try { begin(); return; } catch (e) {}
              }
              self.clearTimer();
              self.isListening = false;
              if (onEndCallback) onEndCallback();
            };
            rec.onerror = function(err) {
              var code = err.error || "Speech error";
              if (code === 'no-speech' || code === 'aborted') { return; }
              self.userStopped = true;
              self.clearTimer();
              self.isListening = false;
              if (onErrorCallback) onErrorCallback(code);
            };
            self.recognition = rec;
            rec.start();
          };

          this.isListening = true;
          begin();
          this.armTimer();
          return true;
        } catch (e) {
          this.isListening = false;
          this.clearTimer();
          if (onErrorCallback) onErrorCallback(e.toString());
          return false;
        }
      },
      stop: function() {
        this.userStopped = true;
        this.clearTimer();
        if (this.recognition) {
          try { this.recognition.stop(); } catch (e) {}
        }
        this.isListening = false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
